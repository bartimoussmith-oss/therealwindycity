<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#091421;color:#dceafa;font:13px system-ui}header{padding:15px;color:#61ead7;letter-spacing:2px;border-bottom:1px solid #294158}main{display:grid;grid-template-columns:2fr 1fr;height:555px}svg{width:100%;height:100%;background:radial-gradient(#274058 1px,transparent 1px);background-size:22px 22px}aside{padding:20px;overflow:auto;border-left:1px solid #294158}button{background:#183149;color:#dceafa;border:1px solid #45627a;border-radius:5px;padding:5px 12px;margin-left:8px;cursor:pointer}a{color:#61ead7}pre{white-space:pre-wrap;line-height:1.7}small{color:#8da7c0}</style></head><body><header>RECORD ATLAS <button id="plus">+</button><button id="minus">−</button><button id="reset">Reset</button></header><main><svg viewBox="0 0 800 560" aria-label="Record graph"><g id="world"></g></svg><aside><small>EXTRACTED IDENTIFIER</small><h2 id="key"></h2><h3 id="title"></h3><pre id="excerpt"></pre><a id="source" target="_blank" rel="noopener noreferrer">Open source ↗</a></aside></main><script>
const data=/*DATA*/;const $=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';let scale=1,dx=0,dy=0;function transform(){$('world').setAttribute('transform',`translate(${dx} ${dy}) translate(400 280) scale(${scale}) translate(-400 -280)`)}function show(n){$('title').textContent=n.title;$('excerpt').textContent=n.text;$('source').href=n.url}$('key').textContent=data.key;function el(tag,attrs){let e=document.createElementNS(ns,tag);for(let k in attrs)e.setAttribute(k,attrs[k]);$('world').append(e);return e}data.nodes.forEach((n,i)=>{let a=(i-1)/Math.max(1,data.nodes.length-1)*Math.PI*2,x=i?400+280*Math.cos(a):400,y=i?280+210*Math.sin(a):280;if(i)el('line',{x1:400,y1:280,x2:x,y2:y,stroke:'#416b87'});let c=el('circle',{cx:x,cy:y,r:i?10:20,fill:i?'#77acff':'#61ead7',tabindex:0,role:'button','aria-label':n.title,style:'cursor:pointer'});c.onclick=()=>show(n);c.onkeydown=e=>{if(e.key==='Enter')show(n)};let t=el('text',{x:x,y:y+26,fill:'#dceafa','text-anchor':'middle','font-size':11});t.textContent=n.title.slice(0,28)});$('plus').onclick=()=>{scale=Math.min(4,scale*1.2);transform()};$('minus').onclick=()=>{scale=Math.max(.3,scale/1.2);transform()};$('reset').onclick=()=>{scale=1;dx=dy=0;transform()};let svg=document.querySelector('svg'),drag;svg.onpointerdown=e=>{if(e.target.tagName==='circle')return;drag={x:e.clientX,y:e.clientY,dx,dy};svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(drag){let r=svg.getBoundingClientRect();dx=drag.dx+(e.clientX-drag.x)*800/r.width;dy=drag.dy+(e.clientY-drag.y)*560/r.height;transform()}};svg.onpointerup=()=>drag=null;svg.onpointercancel=()=>drag=null;show(data.nodes[0]);
</script></body></html>
