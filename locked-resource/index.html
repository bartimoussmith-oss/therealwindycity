<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Protected resource</title>
  <style>
    :root { color-scheme: light; --ink:#1f2937; --muted:#5b6472; --line:#d8dee8; --blue:#173d63; --bg:#f3f6fa; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
    main { width:min(560px,calc(100% - 32px)); margin:10vh auto; padding:28px; background:white; border:1px solid var(--line); border-radius:16px; box-shadow:0 8px 32px #182b4212; }
    h1 { margin:0 0 8px; font-size:1.45rem; color:var(--blue); }
    p { color:var(--muted); }
    label { display:block; margin:22px 0 6px; font-weight:650; }
    input { width:100%; padding:12px; border:1px solid #aeb9c8; border-radius:8px; font:inherit; }
    button { margin-top:12px; width:100%; border:0; border-radius:8px; padding:12px 16px; background:var(--blue); color:white; font:inherit; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.65; cursor:wait; }
    #status { min-height:1.5em; margin-top:12px; color:#9b2c25; font-size:.92rem; }
    #viewer { display:none; width:100%; height:90vh; border:0; background:white; }
    body.open { background:white; }
    body.open main { display:none; }
    body.open #viewer { display:block; }
    .note { font-size:.85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Protected resource</h1>
    <p>This page is encrypted. Enter the passphrase to decrypt it in this browser.</p>
    <form id="unlock-form">
      <label for="passphrase">Passphrase</label>
      <input id="passphrase" name="passphrase" type="password" autocomplete="current-password" required autofocus>
      <button id="unlock" type="submit">Decrypt and open</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
    <p class="note">The passphrase is not sent to a server or saved by this page. Refreshing locks the resource again. Anyone with the passphrase can view or copy its contents.</p>
  </main>
  <iframe id="viewer" title="Decrypted resource" sandbox="allow-scripts allow-forms allow-popups allow-downloads" referrerpolicy="no-referrer"></iframe>
  <script>
    'use strict';
    const form = document.getElementById('unlock-form');
    const passphrase = document.getElementById('passphrase');
    const button = document.getElementById('unlock');
    const status = document.getElementById('status');
    const decoder = new TextDecoder('utf-8', { fatal: true });

    function fromBase64(value) {
      const binary = atob(value);
      return Uint8Array.from(binary, ch => ch.charCodeAt(0));
    }

    async function decrypt(payload, password) {
      if (payload.version !== 1 || payload.kdf !== 'PBKDF2-SHA-256' || payload.cipher !== 'AES-256-GCM') {
        throw new Error('Unsupported encrypted payload.');
      }
      const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: fromBase64(payload.salt), iterations: payload.iterations, hash: 'SHA-256' },
        material,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
      const plaintext = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: fromBase64(payload.iv), tagLength: 128 },
        key,
        fromBase64(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      button.disabled = true;
      status.style.color = '';
      status.textContent = 'Decrypting…';
      try {
        const response = await fetch('./payload.json', { cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' });
        if (!response.ok) throw new Error('Encrypted content is unavailable.');
        const html = await decrypt(await response.json(), passphrase.value);
        document.getElementById('viewer').srcdoc = html;
        document.body.classList.add('open');
        passphrase.value = '';
      } catch (error) {
        status.textContent = error instanceof TypeError ? 'Could not load encrypted content. Please try again.' : 'The passphrase is incorrect or the encrypted content is damaged.';
        passphrase.focus();
        passphrase.select();
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
