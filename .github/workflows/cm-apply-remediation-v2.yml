name: CM verify remediation v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cm-apply-remediation-v2.yml']
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
concurrency:
  group: cm-apply-remediation-v2
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'bartimoussmith-oss/therealwindycity' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install requests beautifulsoup4 pypdf pdfplumber curl_cffi
      - name: Verify current backend without modifying source
        id: checks
        shell: bash
        run: |
          set -euo pipefail
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            python3 -m unittest tests/test_granicus_harvester.py -v
            python3 -m unittest tools/test_wyoming_ingest_safety.py -v
            python3 -m unittest tools/test_wyoming_instantiate.py -v
            python3 -m unittest tools/test_wyoming_verify.py -v
          } 2>&1 | tee /tmp/cm-backend-current-tests.log
          git diff --exit-code
      - name: Record backend result and frontend blockers
        if: always()
        uses: actions/github-script@v7
        env:
          CHECK_OUTCOME: ${{ steps.checks.outcome }}
          CHECK_REVISION: ${{ steps.checks.outputs.revision }}
        with:
          script: |
            const target={...context.repo};
            const report={schema:1,project_credit:'CM',observed_at:new Date().toISOString(),backend:{revision:process.env.CHECK_REVISION||null,tests:process.env.CHECK_OUTCOME||'unknown',run:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`},frontend:[],gaps:[],scope:'Current backend tests and bounded public workflow failure evidence; no patch replay, production cutover or source-freshness certification'};
            const front={owner:'therealwindycity',repo:'TheReelWindyCity'};
            const names=new Set(['CM apply frontend remediation v2','CM clean candidate validation']);
            try {
              const runs=(await github.rest.actions.listWorkflowRunsForRepo({...front,branch:'main',per_page:100})).data.workflow_runs;
              for(const name of names){
                const run=runs.find(r=>r.name===name);
                if(!run){report.gaps.push({workflow:name,error:'Not found in sampled main runs'});continue;}
                const item={name,id:run.id,sha:run.head_sha,url:run.html_url,status:run.status,conclusion:run.conclusion,jobs:[]};
                report.frontend.push(item);
                try{
                  const jobs=(await github.rest.actions.listJobsForWorkflowRun({...front,run_id:run.id,per_page:30})).data.jobs;
                  item.jobs=jobs.map(j=>({name:j.name,url:j.html_url,conclusion:j.conclusion,failed_steps:(j.steps||[]).filter(s=>['failure','timed_out'].includes(s.conclusion)).map(s=>s.name)}));
                  for(const job of jobs.filter(j=>j.conclusion==='failure').slice(0,2)){
                    try{
                      const response=await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs',{...front,job_id:job.id});
                      if(typeof response.data!=='string'){report.gaps.push({job:job.id,error:'Log response not text'});continue;}
                      const lines=response.data.split(/\r?\n/).filter(line=>/error|fatal|conflict|assertion|traceback/i.test(line)).slice(-8).map(line=>/token|secret|password|authorization/i.test(line)?'[credential-related line omitted]':line.slice(0,400));
                      item.jobs.find(j=>j.url===job.html_url).error_excerpt=lines;
                    }catch(e){report.gaps.push({job:job.id,check:'public_error_excerpt',status:e.status||null});}
                  }
                }catch(e){report.gaps.push({run:run.id,check:'jobs',status:e.status||null});}
              }
            }catch(e){report.gaps.push({check:'frontend_actions',status:e.status||null});}
            const branch='cm-remediation-status';
            try{await github.rest.git.getRef({...target,ref:'heads/'+branch});}
            catch(e){if(e.status!==404)throw e;const head=await github.rest.repos.getCommit({...target,ref:'main'});await github.rest.git.createRef({...target,ref:'refs/heads/'+branch,sha:head.data.sha});}
            const path='status/remediation-v2.json';let sha;
            try{sha=(await github.rest.repos.getContent({...target,path,ref:branch})).data.sha;}catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({...target,branch,path,sha,message:'CM: record remediation verification evidence [skip ci]',content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64')});
            await core.summary.addHeading('CM remediation verification').addRaw(`Backend tests: ${report.backend.tests}. Evidence saved on cm-remediation-status; gaps are explicit.`).write();
      - name: Preserve test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cm-remediation-current-tests-${{ github.run_id }}
          path: /tmp/cm-backend-current-tests.log
          if-no-files-found: warn
