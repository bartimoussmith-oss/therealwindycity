name: Promethean Recurring Harvest
on:
  schedule:
    - cron: "0 8,20 * * *"
  workflow_dispatch:
jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils gh
      - name: Install Python Dependencies
        run: pip install requests beautifulsoup4 pdfplumber pytesseract pdf2image pypdf
      - name: Execute Extraction Pipelines
        run: |
          python3 scrapers/granicus_harvester.py "https://cheyenne.granicus.com/ViewPublisher.php?view_id=5" --historical
          python3 scrapers/granicus_harvester.py "https://cheyenne.granicus.com/ViewPublisher.php?view_id=2" --historical
          python3 scrapers/connect_cheyenne_harvester.py || true
      - name: Provision Storage Shards & Push
        env:
          GH_TOKEN: ${{ secrets.PROMETHEAN_ARCHIVE_TOKEN }}
        run: |
          chmod +x tools/storage_shard_manager.sh
          ./tools/storage_shard_manager.sh || true
          git config user.name "Promethean-AutoHarvester"
          git config user.email "cwdm82001@gmail.com"
          git add STORAGE_MANIFEST.md database/promethean_evidence.db || true
          if ! git diff --cached --quiet; then
            git commit -m "Automated Harvest: Metadata updated, heavy payloads routed to external shards"
            git push origin HEAD:main
          fi
