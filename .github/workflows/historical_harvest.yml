name: Promethean Recurring Harvest
on:
  schedule:
    - cron: "0 8,20 * * *"
  workflow_dispatch:
jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests beautifulsoup4
      - run: |
          python3 scrapers/granicus_harvester.py "https://cheyenne.granicus.com/ViewPublisher.php?view_id=5" --historical
          python3 scrapers/granicus_harvester.py "https://cheyenne.granicus.com/ViewPublisher.php?view_id=2" --historical
          python3 scrapers/connect_cheyenne_harvester.py
      - run: |
          git config user.name "Promethean-AutoHarvester"
          git config user.email "cwdm82001@gmail.com"
          git add artifacts/ database/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Automated Harvest: SHA-512 Cryptographic Rescan & Connect Cheyenne"
            git push origin HEAD:main
          fi
