name: Validate Laramie Socrata datasets
on:
  push:
    branches: [main]
    paths: ['.github/workflows/socrata-datasets.yml', 'scripts/socrata_datasets.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: socrata-dataset-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Test metadata and bounded read-only queries
        env:
          SOCRATA_USERNAME: ${{ secrets.SOCRATA_USERNAME }}
          SOCRATA_PASSWORD: ${{ secrets.SOCRATA_PASSWORD }}
        run: python scripts/socrata_datasets.py
      - name: Save sanitized validation results
        if: always()
        run: |
          if [ ! -f scanner-results/socrata/datasets.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scanner-results/socrata/datasets.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Validate Laramie source datasets $GITHUB_RUN_ID"
          git pull --rebase origin main
          git push origin HEAD:main
