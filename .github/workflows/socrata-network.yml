name: Citizen Connect network discovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/socrata-network.yml', 'scripts/socrata_network.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect public dashboard without credentials
        run: python scripts/socrata_network.py
      - name: Save sanitized findings
        if: always()
        run: |
          if [ ! -f scanner-results/socrata/network.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scanner-results/socrata/network.json
          git commit -m "Save dashboard network diagnostic $GITHUB_RUN_ID"
          git pull --rebase origin main
          git push origin HEAD:main
