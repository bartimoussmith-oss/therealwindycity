name: Wyoming fast-track collection
on:
  workflow_dispatch:
    inputs:
      workers:
        description: 'Parallel communities (1-8)'
        type: choice
        options: ['4', '1', '2', '8']
        default: '4'
permissions:
  contents: read
concurrency:
  group: wyoming-fast-track
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install document extraction tools
        run: python -m pip install pypdf python-docx openpyxl
      - name: Check generated instances
        run: python tools/wyoming_instantiate.py --check
      - name: Collect enabled sources and build pages
        env:
          WYOMING_WORKERS: ${{ inputs.workers }}
        run: python tools/wyoming_fast_track.py
      - name: Save generated pages and progress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wyoming-fast-track-${{ github.run_id }}
          path: fast-track-results/
          if-no-files-found: warn
          retention-days: 14
