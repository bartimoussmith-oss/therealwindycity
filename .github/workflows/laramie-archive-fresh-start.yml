name: Laramie Archive Fresh Start
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: laramie-public-results
  cancel-in-progress: false
jobs:
  fresh-archive-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out verified archive code
        uses: actions/checkout@v4
        with:
          ref: 2b75dfeee1c9b73e4a8c3c7ddc7c2d834fbc8ac1
          persist-credentials: false
      - name: Check out results destination
        id: storage
        uses: actions/checkout@v4
        with:
          ref: main
          path: results-repository
      - name: Install transcription dependencies
        run: |
          mkdir -p results
          python -m pip install requests 'faster-whisper==1.2.1' 'av==18.1.0' PyYAML
          python -m pip check
      - name: Transcribe sample archive
        id: transcribe
        env:
          ARCHIVE_DATE: ''
          BC_USER: ${{ secrets.BROADCASTIFY_USERNAME }}
          BC_PASS: ${{ secrets.BROADCASTIFY_PASSWORD }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml
          workflow = yaml.safe_load(Path('.github/workflows/scanner-archive-test.yml').read_text())
          steps = workflow['jobs']['archive']['steps']
          command = next(step['run'] for step in steps if step.get('name') == 'Download and transcribe one archive')
          if '/archives/api/play.php' not in command or '/archives/ajax.php' in command:
              raise SystemExit('Archive endpoint verification failed.')
          result = subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', command], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          if result.returncode:
              raise SystemExit('Archive transcription failed; raw diagnostics withheld.')
          PY
      - name: Save public transcripts and status
        if: ${{ always() && steps.storage.outcome == 'success' }}
        env:
          TRANSCRIBE_OUTCOME: ${{ steps.transcribe.outcome }}
        run: |
          python - <<'PY'
          import datetime, json, os, subprocess
          from pathlib import Path
          root = Path('results-repository')
          run_id = os.environ['GITHUB_RUN_ID']
          attempt = os.environ['GITHUB_RUN_ATTEMPT']
          relative = Path('scanner-results/runs') / (run_id + '-' + attempt)
          target = root / relative
          target.mkdir(parents=True, exist_ok=True)
          saved = []
          for name in ('transcript.json', 'transcript.txt'):
              source = Path('results') / name
              if source.is_file():
                  (target / name).write_bytes(source.read_bytes())
                  saved.append(name)
          outcome = os.environ.get('TRANSCRIBE_OUTCOME', 'unknown')
          status = {
              'status': 'success' if outcome == 'success' and len(saved) == 2 else 'incomplete',
              'transcription_step': outcome,
              'recorded_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'run_id': run_id, 'run_attempt': attempt,
              'workflow_url': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + run_id,
              'result_directory': str(relative), 'files': saved,
              'settings': {'model': 'tiny.en', 'device': 'cpu', 'compute_type': 'int8', 'language': 'en', 'vad_filter': True, 'condition_on_previous_text': False},
              'review_required': True,
              'review_flags': ['unverified_automated_transcription', 'not_a_verified_incident_report', 'segment_offsets_not_wall_clock_times'],
              'visibility': 'public',
              'notice': 'Automated transcript may contain errors. Do not treat it as verified reporting. Raw audio, credentials, and diagnostic logs are not committed.'
          }
          text = json.dumps(status, indent=2) + '\n'
          (target / 'status.json').write_text(text, encoding='utf-8')
          (root / 'scanner-results/latest.json').write_text(text, encoding='utf-8')
          def git(*args):
              subprocess.run(['git', '-C', str(root), *args], check=True)
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('add', '--', str(relative), 'scanner-results/latest.json')
          git('commit', '-m', 'Save public scanner results for run ' + run_id + ' attempt ' + attempt)
          git('pull', '--rebase', 'origin', 'main')
          git('push', 'origin', 'HEAD:main')
          PY
      - name: Remove local audio and diagnostics
        if: always()
        run: rm -rf results
