name: Wyoming verifier safety tests
on:
  push:
    paths:
      - 'tools/wyoming_verify.py'
      - 'tools/wyoming_instantiate.py'
      - 'tools/test_wyoming_verify.py'
      - '.github/workflows/wyoming-verifier-tests.yml'
  pull_request:
    paths:
      - 'tools/wyoming_verify.py'
      - 'tools/wyoming_instantiate.py'
      - 'tools/test_wyoming_verify.py'
      - '.github/workflows/wyoming-verifier-tests.yml'
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tools/test_wyoming_verify.py
