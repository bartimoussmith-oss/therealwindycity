name: Laramie Archive Transcriber
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'MM/DD/YYYY; blank tests sample recording 47003-1792597004 directly'
        required: false
        type: string
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Prepare
        run: |
          mkdir -p results
          python -m pip install requests faster-whisper
      - name: Download and transcribe one archive
        env:
          ARCHIVE_DATE: ${{ inputs.date }}
          BC_USER: ${{ secrets.BROADCASTIFY_USERNAME }}
          BC_PASS: ${{ secrets.BROADCASTIFY_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          python -u - <<'PY' 2>&1 | tee results/run.log
          import datetime, json, os, re
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import requests
          from faster_whisper import WhisperModel

          root = 'https://www.broadcastify.com'
          if not os.environ.get('BC_USER') or not os.environ.get('BC_PASS'):
              raise SystemExit('Missing Broadcastify repository secrets.')
          session = requests.Session()
          session.headers['User-Agent'] = 'ScannerArchiveTest/1.1'
          try:
              response = session.post(root + '/login/', data={'username': os.environ['BC_USER'], 'password': os.environ['BC_PASS'], 'action': 'auth', 'redirect': root}, allow_redirects=False, timeout=30)
              if not any(c.name == 'bcfyuser1' and c.value for c in session.cookies):
                  raise SystemExit(f'Archive login failed: HTTP {response.status_code}. Cookies and response withheld.')

              def api(path, params):
                  response = session.get(root + path, params=params, timeout=30, allow_redirects=False)
                  print('API', path, 'HTTP', response.status_code)
                  if response.status_code == 429:
                      raise SystemExit('Broadcastify download limit reached; stopping. Contact provider before retrying.')
                  if response.status_code != 200:
                      raise SystemExit('API access failed; stopping without logging response or credentials.')
                  try:
                      payload = response.json()
                  except ValueError:
                      raise SystemExit('Expected JSON but received another response format.')
                  if not isinstance(payload, dict):
                      raise SystemExit('Unexpected API response structure.')
                  return payload

              supplied = os.environ.get('ARCHIVE_DATE', '').strip()
              archive_id = '47003-1792597004'
              if supplied:
                  day = datetime.datetime.strptime(supplied, '%m/%d/%Y').date()
                  listing = api('/archives/api/archives.php', {'feedId': '47003', 'date': day.strftime('%m/%d/%Y')})
                  rows = listing.get('archives')
                  if not isinstance(rows, list) or not rows:
                      raise SystemExit('No archives returned for this date.')
                  archive_id = str(rows[0]['id'])
                  print('Recordings listed:', len(rows))
              if not re.fullmatch(r'47003-[0-9]+', archive_id):
                  raise SystemExit('Unexpected archive identifier.')
              metadata = api('/archives/api/play.php', {'id': archive_id})
              if not isinstance(metadata.get('url'), str) or not metadata['url']:
                  raise SystemExit('Playback API did not return an audio URL.')
              audio_url = urljoin(root, metadata['url'])
              if urlparse(audio_url).scheme != 'https':
                  raise SystemExit('Refusing non-HTTPS audio download.')
              audio = Path('results/archive.mp3')
              with session.get(audio_url, stream=True, timeout=(30, 60)) as response:
                  print('Audio download HTTP', response.status_code)
                  if response.status_code != 200:
                      raise SystemExit('Audio download failed. URL and body withheld.')
                  content_type = response.headers.get('Content-Type', '').lower()
                  if 'text/' in content_type or 'json' in content_type:
                      raise SystemExit('Download returned non-audio content.')
                  with audio.open('wb') as output:
                      for chunk in response.iter_content(65536):
                          output.write(chunk)
                          if output.tell() > 100_000_000:
                              raise SystemExit('Archive exceeded 100 MB test limit.')
              if not audio.stat().st_size:
                  raise SystemExit('Empty audio download.')
              print('Downloaded bytes:', audio.stat().st_size, 'archive:', archive_id)
          except requests.RequestException as exc:
              raise SystemExit('Network request failed: ' + type(exc).__name__ + '. URLs and credentials withheld.')
          model = WhisperModel('tiny.en', device='cpu', compute_type='int8')
          segments, info = model.transcribe(str(audio), language='en', vad_filter=True, condition_on_previous_text=False)
          source = root + '/archives/feed/47003/' + archive_id
          result = {'feed_id': '47003', 'archive_id': archive_id, 'source': source, 'credit': metadata.get('feedDescr', 'Laramie County Law Enforcement'), 'license': 'https://creativecommons.org/licenses/by/3.0/us/', 'notice': 'Automated transcription adapted from source audio; unverified and may contain errors. Segment offsets are not wall-clock times.', 'metadata': {key: metadata.get(key) for key in ['dateDisplay', 'startDisplay', 'endDisplay', 'tzDisplay']}, 'segments': []}
          for segment in segments:
              result['segments'].append({'start_seconds': segment.start, 'end_seconds': segment.end, 'text': segment.text.strip()})
          Path('results/transcript.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          header = '\n'.join([result['notice'], result['credit'], source, result['license']])
          lines = [f"[{s['start_seconds']:.1f}-{s['end_seconds']:.1f}] {s['text']}" for s in result['segments']]
          Path('results/transcript.txt').write_text(header + '\n' + '\n'.join(lines), encoding='utf-8')
          print('Transcription complete; segments:', len(result['segments']))
          PY
      - name: Delete audio
        if: always()
        run: rm -f results/archive.mp3
      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-archive-test-${{ github.run_id }}
          path: results/
          retention-days: 7
