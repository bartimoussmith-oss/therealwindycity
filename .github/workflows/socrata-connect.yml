name: Socrata read-only connection diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/socrata-connect.yml', 'scripts/socrata_connect.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: socrata-connection-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser dependencies
        run: |
          python -m pip install requests playwright
          python -m playwright install --with-deps chromium
      - name: Test authorized access and inspect public dashboard
        env:
          SOCRATA_USERNAME: ${{ secrets.SOCRATA_USERNAME }}
          SOCRATA_PASSWORD: ${{ secrets.SOCRATA_PASSWORD }}
        run: python scripts/socrata_connect.py
      - name: Save sanitized diagnostic
        if: always()
        run: |
          if [ ! -f scanner-results/socrata/connection.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scanner-results/socrata/connection.json
          git commit -m "Save sanitized Socrata diagnostic $GITHUB_RUN_ID"
          git pull --rebase origin main
          git push origin HEAD:main
