name: Apply remaining remediation
on:
  push:
    branches: [main]
    paths:
      - scripts/apply_remaining_remediation.py
      - remediation_runtime.py
      - .github/workflows/apply-remediation.yml
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: civic-ledger-writes
  cancel-in-progress: false
jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply scoped patches and compile
        run: python3 scripts/apply_remaining_remediation.py
      - name: Commit verified source repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- streamlit_app.py Transparency_Index_App.py rwc_views.py cheyenne_watchdog_vault.py pages/24_Unified_Records.py .gitignore requirements.txt
          if git ls-files --error-unmatch -- .sudo_as_admin_successful >/dev/null 2>&1; then
            git add -u -- .sudo_as_admin_successful
          fi
          if git diff --staged --quiet; then
            echo "Remediation already applied."
          else
            git commit -m "fix(app): unify records access, initialize databases and clean repository [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
