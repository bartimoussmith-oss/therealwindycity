name: Wyoming Chrome collection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - engine/ingest.py
      - requirements.txt
      - .github/workflows/wyoming-chrome-collection.yml
permissions:
  contents: read
concurrency:
  group: wyoming-chrome-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check permanent collector syntax
        run: python -m py_compile engine/ingest.py
      - name: Collect enabled jurisdictions with failure isolation
        env:
          WYOMING_WORKERS: '4'
        run: python tools/wyoming_fast_track.py
      - name: Retain collection results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wyoming-chrome-results
          path: fast-track-results/
          if-no-files-found: warn
