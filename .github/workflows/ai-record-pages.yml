name: ai-record-pages
on:
  push:
    branches: [main, "arena/**", "feature/media-drop-studio", "feature/issue-newsroom"]
    paths:
      - "tools/ai_record_status.py"
      - "tools/check_ai_record.py"
      - "tools/test_ai_record_status.py"
      - "tools/build_ai_record.py"
      - "tools/render_ai_record.py"
      - "tools/ai_record_extract.py"
      - "tools/ai_record_ocr.py"
      - "tools/ai_record_static/**"
      - "pipeline/corpus/**"
      - "drive-import/**"
      - "tools/ai_record_drive.py"
      - "civic_atlas/osint.html"
      - "civic_atlas/osint-atlas.html"
      - "civic_atlas/osint-original.html"
      - "civic_atlas/osint/**"
      - "civic_atlas/build_osint_index.py"
      - "civic_atlas/server.py"
      - "civic_atlas/media/**"
      - "tools/publish_media_studio.py"
      - "tools/test_media_studio.py"
      - "tools/issue_newsroom.py"
      - "tools/test_issue_newsroom.py"
      - "tools/finish_issue_newsroom.py"
      - "tools/test_finish_issue_newsroom.py"
      - "tools/build_arrest_page.py"
      - "tools/arrest_page_seal.mjs"
      - "data/arrests/**"
      - ".github/workflows/ai-record-pages.yml"
  schedule:
    - cron: "41 8 * * *"
  workflow_dispatch:
    inputs:
      ocr_minutes:
        description: "Minutes to spend OCR-ing scanned pages this run (0 = skip)"
        default: "0"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ai-record-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-media:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate media and newsroom
        run: |
          python3 tools/publish_media_studio.py --check-only
          python3 -m unittest discover -s tools -p 'test_media_studio.py' -v
          python3 -m unittest discover -s tools -p 'test_issue_newsroom.py' -v
          python3 -m unittest discover -s tools -p 'test_finish_issue_newsroom.py' -v
          node --check civic_atlas/media/studio.js
          node --check civic_atlas/media/newsroom-editor.js
  build:
    needs: validate-media
    if: ${{ github.ref != 'refs/heads/feature/media-drop-studio' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install tools
        run: |
          pip install pymupdf beautifulsoup4 markdown wordninja rapidocr-onnxruntime
          pip uninstall -y opencv-python || true
          pip install opencv-python-headless
      - name: Test snapshot and deployment safeguards
        run: python3 -m unittest discover -s tools -p 'test_ai_record_status.py' -v
      - name: Meeting index from Civic Cheyenne
        run: |
          git clone -q --depth 1 https://github.com/therealwindycity/TheReelWindyCity.git /tmp/fe
          (cd /tmp/fe && node scripts/build-data.mjs)
      - name: Transcripts
        run: git clone -q --depth 1 https://github.com/therealwindycity/The-Real-Windy-City-.git /tmp/tr
      - name: Extract text from all six archive repos
        run: python3 -u tools/ai_record_extract.py --text /tmp/text --trees /tmp/trees
      - name: OCR scanned pages
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.ocr_minutes != '0')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          OCR_MINUTES: ${{ github.event_name == 'schedule' && '240' || inputs.ocr_minutes }}
        run: python3 -u tools/ai_record_ocr.py --text /tmp/text --cache ai-record-ocr --minutes "$OCR_MINUTES"
      - name: Commit OCR cache
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.ocr_minutes != '0')) }}
        run: |
          git config user.name "civic-engine-bot"
          git config user.email "civic-engine@localhost"
          git add ai-record-ocr
          if git commit -q -m "ai-record OCR cache $(date -u +%Y-%m-%dT%H:%MZ)"; then
            git pull -q --rebase && git push -q
          else
            echo "no new OCR pages"
          fi
      - name: Build Markdown record
        run: |
          python3 -u tools/build_ai_record.py --meetings /tmp/fe/src/data/meetings.json --text /tmp/text \
            --ocr ai-record-ocr --transcripts /tmp/tr --minutes pipeline/corpus --trees /tmp/trees --drive-db drive-import/master_meetings_database.json.gz --out /tmp/ai-record
      - name: Render static site
        run: python3 -u tools/render_ai_record.py --src /tmp/ai-record --out _site --extra public/index.html=ledger.html
      - name: Verify rendered snapshot and key pages
        run: python3 tools/check_ai_record.py --site _site --revision "$GITHUB_SHA" --run "$GITHUB_RUN_ID"
      - name: Publish standalone Laramie County OSINT workspaces
        run: |
          mkdir -p _site/osint
          cp civic_atlas/osint.html civic_atlas/osint-atlas.html civic_atlas/osint-original.html _site/
          cp civic_atlas/osint/app.js civic_atlas/osint/style.css _site/osint/
          python3 -m civic_atlas.build_osint_index --out _site/osint/search-index.json
      - name: Add Media Studio
        run: python3 tools/publish_media_studio.py --out _site
      - name: Build real-corpus issue newsroom and media inputs
        run: python3 tools/finish_issue_newsroom.py --corpus /tmp/ai-record --site _site --revision "$GITHUB_SHA"
      - name: Arrest database page (sealed, AES-256-GCM)
        env:
          ARREST_PAGE_PASSWORD: ${{ secrets.ARREST_PAGE_PASSWORD }}
        run: python3 -u tools/build_arrest_page.py --out _site/arrest
      - name: Verify complete artifact budget and newsroom links
        run: python3 tools/finish_issue_newsroom.py --site _site --verify-only
      - name: Preserve measured newsroom coverage
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-coverage-${{ github.sha }}
          path: _site/newsroom/coverage.json
          retention-days: 7
      - name: Preserve non-production browser preview
        if: ${{ github.ref == 'refs/heads/feature/issue-newsroom' }}
        uses: actions/upload-artifact@v4
        with:
          name: issue-newsroom-preview-${{ github.sha }}
          path: _site
          retention-days: 3
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify published build
        env:
          PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 tools/check_ai_record.py --url "$PUBLISHED_URL" --revision "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --attempts 6
      - name: Verify published Media Studio and newsroom revision
        env:
          PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          base=os.environ['PUBLISHED_URL'].rstrip('/')+'/'
          def get(path):
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(base+path+'?revision='+os.environ['GITHUB_SHA'],timeout=30) as r:
                          return r.read()
                  except Exception:
                      if attempt==5: raise
                      time.sleep(15)
          for name in ('index.html','builder.html','review.html','drops.json','studio.js','studio.css','newsroom.html','newsroom-editor.js'):
              if get('media/'+name)!=(Path('civic_atlas/media')/name).read_bytes():
                  raise ValueError('Published media bytes differ: '+name)
          coverage=json.loads(get('newsroom/coverage.json'))
          assert coverage['integration_revision']==os.environ['GITHUB_SHA']
          assert coverage['included_representations']>0
          assert coverage['editor_input_packets']>0
          assert b'Issue Newsroom' in get('newsroom/index.html')
          issues=json.loads(get('newsroom/issues.json'))
          first=issues[0]['id']
          packet=json.loads(get('newsroom/issues/'+first+'/editor.json'))
          assert packet['issue_id']==first and len(packet['evidence'])>0
          PY
