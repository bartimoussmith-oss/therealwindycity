name: ai-record-pages
# Builds the AI-readable mirror of the whole Cheyenne meetings record
# (every archived document as plain text + transcripts + minutes + indexes)
# and publishes it to GitHub Pages:
#   https://bartimoussmith-oss.github.io/therealwindycity/
# Nothing generated is committed except the small OCR cache (ai-record-ocr/).
# See tools/README-ai-record.md.

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "tools/ai_record_status.py"
      - "tools/check_ai_record.py"
      - "tools/test_ai_record_status.py"
      - "tools/build_ai_record.py"
      - "tools/render_ai_record.py"
      - "tools/ai_record_extract.py"
      - "tools/ai_record_ocr.py"
      - "tools/ai_record_static/**"
      - "pipeline/corpus/**"
      - "drive-import/**"
      - "tools/ai_record_drive.py"
      - "civic_atlas/osint.html"
      - "civic_atlas/osint-atlas.html"
      - "civic_atlas/osint-original.html"
      - "civic_atlas/osint/**"
      - "civic_atlas/build_osint_index.py"
      - "civic_atlas/server.py"
      - "tools/build_arrest_page.py"
      - "tools/arrest_page_seal.mjs"
      - "data/arrests/**"
      - ".github/workflows/ai-record-pages.yml"
  schedule:
    - cron: "41 8 * * *"          # daily: picks up new archive files and continues OCR
  workflow_dispatch:
    inputs:
      ocr_minutes:
        description: "Minutes to spend OCR-ing scanned pages this run (0 = skip)"
        default: "0"

permissions:
  contents: write                  # commit the OCR cache
  pages: write
  id-token: write

concurrency:
  group: ai-record-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install tools
        run: |
          pip install pymupdf beautifulsoup4 markdown wordninja rapidocr-onnxruntime
          pip uninstall -y opencv-python || true
          pip install opencv-python-headless
      - name: Test snapshot and deployment safeguards
        run: python3 -m unittest discover -s tools -p 'test_ai_record_status.py' -v
      - name: Meeting index from Civic Cheyenne (same grouping as the site)
        run: |
          git clone -q --depth 1 https://github.com/therealwindycity/TheReelWindyCity.git /tmp/fe
          (cd /tmp/fe && node scripts/build-data.mjs)
      - name: Transcripts
        run: git clone -q --depth 1 https://github.com/therealwindycity/The-Real-Windy-City-.git /tmp/tr
      - name: Extract text from all six archive repos
        run: python3 -u tools/ai_record_extract.py --text /tmp/text --trees /tmp/trees
      - name: OCR scanned pages (incremental, cached in ai-record-ocr/)
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.ocr_minutes != '0')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          OCR_MINUTES: ${{ github.event_name == 'schedule' && '240' || inputs.ocr_minutes }}
        run: python3 -u tools/ai_record_ocr.py --text /tmp/text --cache ai-record-ocr --minutes "$OCR_MINUTES"
      - name: Commit OCR cache
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.ocr_minutes != '0')) }}
        run: |
          git config user.name "civic-engine-bot"
          git config user.email "civic-engine@localhost"
          git add ai-record-ocr
          if git commit -q -m "ai-record OCR cache $(date -u +%Y-%m-%dT%H:%MZ)"; then
            git pull -q --rebase && git push -q
          else
            echo "no new OCR pages"
          fi
      - name: Build Markdown record
        run: |
          python3 -u tools/build_ai_record.py --meetings /tmp/fe/src/data/meetings.json --text /tmp/text \
            --ocr ai-record-ocr --transcripts /tmp/tr --minutes pipeline/corpus --trees /tmp/trees --drive-db drive-import/master_meetings_database.json.gz --out /tmp/ai-record
      - name: Render static site
        run: python3 -u tools/render_ai_record.py --src /tmp/ai-record --out _site --extra public/index.html=ledger.html
      - name: Verify rendered snapshot and key pages
        run: python3 tools/check_ai_record.py --site _site --revision "$GITHUB_SHA" --run "$GITHUB_RUN_ID"
      - name: Publish standalone Laramie County OSINT workspaces
        run: |
          mkdir -p _site/osint
          cp civic_atlas/osint.html civic_atlas/osint-atlas.html civic_atlas/osint-original.html _site/
          cp civic_atlas/osint/app.js civic_atlas/osint/style.css _site/osint/
          python3 -m civic_atlas.build_osint_index --out _site/osint/search-index.json
      # Password-gated arrest database -> https://<user>.github.io/therealwindycity/arrest/
      # Static hosting has no server, so the gate is real client-side crypto:
      # tools/build_arrest_page.py shapes the PUBLIC tier only (names and exact
      # ages are already stripped and re-checked by a fail-closed structural
      # gate), then tools/arrest_page_seal.mjs seals it with AES-256-GCM under a
      # PBKDF2-HMAC-SHA256 key. The password comes from a repository secret and
      # is never committed, never logged, and never present in the built site.
      # If the secret is missing the step writes a notice page and publishes NO
      # data rather than publishing an unprotected page; it exits 0 so a missing
      # secret cannot break the rest of the mirror build.
      - name: Arrest database page (sealed, AES-256-GCM)
        env:
          ARREST_PAGE_PASSWORD: ${{ secrets.ARREST_PAGE_PASSWORD }}
        run: python3 -u tools/build_arrest_page.py --out _site/arrest
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify the published build (not just deployment completion)
        env:
          PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 tools/check_ai_record.py --url "$PUBLISHED_URL" --revision "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --attempts 6
