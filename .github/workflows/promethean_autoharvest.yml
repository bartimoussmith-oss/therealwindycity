name: Promethean Autonomous Granicus Harvester

on:
  workflow_dispatch:
    inputs:
      granicus_url:
        description: "Target Granicus Agenda / ViewPublisher URL"
        required: true
        default: "https://cheyenne.granicus.com/ViewPublisher.php?view_id=1"
      output_prefix:
        description: "Dossier Prefix"
        required: true
        default: "Cheyenne_PS_Committee_Nov2"
      committee_name:
        description: "Committee or Body Name"
        required: true
        default: "Public Services Committee"
      meeting_date:
        description: "Meeting Date (YYYY-MM-DD); blank records the harvest date"
        required: false
        default: ""
  schedule:
    # Runs automatically every Monday and Friday at 13:00 UTC (6:00 AM MST / 7:00 AM MDT)
    - cron: "0 13 * * 1,5"

permissions:
  contents: write

# One writer at a time for database/promethean_evidence.db (shared with the recurring harvest).
concurrency:
  group: promethean-evidence-db
  cancel-in-progress: false

jobs:
  harvest-and-index:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System OCR & PDF Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr sqlite3

      - name: Install Forensic Pipeline Dependencies
        run: |
          python -m pip install --upgrade pip
          # pdfplumber, pytesseract and pdf2image are what the harvester actually uses; they were
          # missing here, so every run since the harvester was hardened died on import.
          pip install requests pypdf pdfplumber pytesseract pdf2image

      - name: Harvester regression tests (offline)
        run: python3 -m unittest tests/test_granicus_harvester.py -v

      - name: Initialize SQLite Rhetorical Profiling Schema
        run: |
          mkdir -p database artifacts
          sqlite3 database/promethean_evidence.db < database/schema_rhetorical_profiling.sql

      - name: Execute Hardened Granicus Harvester
        # Inputs reach the shell as environment variables, never by template substitution.
        env:
          TARGET_URL: ${{ github.event.inputs.granicus_url || 'https://cheyenne.granicus.com/ViewPublisher.php?view_id=1' }}
          PREFIX: ${{ github.event.inputs.output_prefix || 'Cheyenne_Auto_Audit' }}
          COMMITTEE: ${{ github.event.inputs.committee_name || 'Cheyenne Governing Body' }}
          MDATE: ${{ github.event.inputs.meeting_date || '' }}
          HARVEST_MAX_SECONDS: "1200"
          HARVEST_DELAY_SECONDS: "2"
        run: |
          set -euo pipefail
          ARGS=("$TARGET_URL" --prefix "$PREFIX" --committee "$COMMITTEE")
          # The schedule used to stamp every new row with a fixed 2026-11-02. With no date given,
          # the harvester records the harvest date instead of a meeting date it does not know.
          if [ -n "$MDATE" ]; then ARGS+=(--date "$MDATE"); fi
          python3 scrapers/granicus_harvester.py "${ARGS[@]}" | tee harvest.log
          {
            echo "### Promethean Autonomous Granicus Harvester"
            echo '```'
            grep -F '[summary]' harvest.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit & Push Updated Evidence Archive
        run: |
          set -uo pipefail
          sqlite3 database/promethean_evidence.db "PRAGMA wal_checkpoint(TRUNCATE);" || true
          git config user.name "Promethean-AutoHarvester"
          git config user.email "bartimoussmith-oss@users.noreply.github.com"
          git add database/promethean_evidence.db
          if git diff --cached --quiet; then
            echo "[*] No new statutory packets detected in this cycle."
            exit 0
          fi
          git commit -m "Automated Forensic Harvest: Updated SQLite FTS5 & Dossier Summaries"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "[!] Push attempt ${attempt} did not land; retrying."
            sleep $((attempt * 15))
          done
          echo "::error::Harvest results could not be pushed after three attempts."
          exit 1
