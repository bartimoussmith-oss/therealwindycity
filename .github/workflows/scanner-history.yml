name: Scanner historical backfill
on:
  push:
    branches: [main]
    paths: ['.github/workflows/scanner-history.yml', 'scripts/scanner_history.py']
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: write
concurrency:
  group: scanner-history
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests 'faster-whisper==1.2.1' 'av==18.1.0'
      - name: Inventory and transcribe bounded batch
        env:
          BC_USER: ${{ secrets.BROADCASTIFY_USERNAME }}
          BC_PASS: ${{ secrets.BROADCASTIFY_PASSWORD }}
        run: python scripts/scanner_history.py
      - name: Persist progress even after a processing failure
        if: always()
        run: |
          if [ ! -d scanner-results/history ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scanner-results/history
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Checkpoint scanner history run $GITHUB_RUN_ID"
          git pull --rebase origin main
          git push origin HEAD:main
